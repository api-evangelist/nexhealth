  schema: API_Errors_NotFound
  title: Resource not found
  remediation: The resource was not found, or it belongs to a location your token cannot access. Note some claim endpoints currently return 500 rather than 404 for unknown ids.
- status: 500
  name: Internal server error
  schema: API_Errors_InternalServerError
  title: Internal server error
  remediation: An unexpected server error occurred. Retry with backoff; contact support if persistent.
notes:
