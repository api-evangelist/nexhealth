envelope:
  description: >-
    NexHealth does not use RFC 9457 problem+json. Every response is a JSON envelope with a boolean
    code flag, a data object, a description array, an optional count, and an error array of strings.
    HTTP status conveys success/failure class; error[] carries the messages.
