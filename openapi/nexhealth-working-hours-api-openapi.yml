    postWorkingHours:
      type: object
      properties:
        working_hour:
          type: object
          description: Configure only one of days, specific_date or custom_recurrence
          properties:
            provider_id:
              type: integer
              format: int32
              description: Id of the provider
              example: 7
            begin_time:
              type: string
              description: At what time working hour starts. Format is HH:MM
              example: 09:00
            end_time:
              type: string
              description: At what time working hour ends. Format is HH:MM
              example: '16:00'
            operatory_id:
              type: integer
              format: int32
              description: Id of the operatory
              example: 149
            appointment_type_ids:
              type: array
              description: Associate appointment types with this working hour
              example:
              - 27
              items:
                type: integer
                format: int32
            days:
              type: array
              description: Configure days of the week for this working hour
              example:
              - Monday
              - Wednesday
              items:
                type: string
                enum:
                - Sunday
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
            specific_date:
              type: string
              format: date
              description: Configure a specific date for this working hour
              example: '2024-11-03'
            custom_recurrence:
              type: object
