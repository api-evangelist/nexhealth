aid: nexhealth
name: NexHealth
description: >-
  NexHealth is a universal, real-time API for healthcare that lets developers read from and write to
  dozens of electronic health record (EHR) and practice management systems through a single standardized
  interface. The NexHealth Synchronizer API covers patients, providers, locations, scheduling and
  available slots, appointments, working hours, clinical notes, treatment plans, documents, insurance
  (plans, coverages, claims, balances), and practice financials (charges, payments, adjustments, fee
  schedules), with signed webhooks for real-time events. It is used across dental and medical practices
  and by health-tech companies building scheduling, billing, and patient-engagement products.
url: https://raw.githubusercontent.com/api-evangelist/nexhealth/refs/heads/main/apis.yml
